services:
  pg:
    image: postgres:17-alpine
    environment: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: sysone }
    ports: ["127.0.0.1:54329:5432"]
  mysql:
    image: mysql:8.4
    environment: { MYSQL_ALLOW_EMPTY_PASSWORD: "yes", MYSQL_DATABASE: sysone }
    ports: ["127.0.0.1:33069:3306"]
  mongo:
    image: mongo:8
    ports: ["127.0.0.1:27029:27017"]
