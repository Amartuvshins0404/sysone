name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm size
      - run: pnpm --filter example-web size
      - run: node spec/source.ts
      - run: |
          cd examples/express && (PORT=3000 node src/server.ts &) && sleep 3 && cd ../.. && node spec/run.ts http://localhost:3000
